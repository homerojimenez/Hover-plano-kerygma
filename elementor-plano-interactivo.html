<div id="kp-plano" aria-label="Plano interactivo de salas">
  <style>
    #kp-plano{--txt:#2f2f2f;--muted:#6f6f6f;--room:#d6d6d8;--hot:#eb568a;--line:#dadada;--card:#fff;--shadow:0 14px 32px rgba(15,15,15,.12);font-family:Inter,Montserrat,Arial,sans-serif;background:transparent;color:var(--txt)}
    #kp-plano *{box-sizing:border-box}
    #kp-plano .grid{display:grid;grid-template-columns:minmax(280px,500px) 1fr;gap:clamp(18px,3vw,42px);align-items:start}
    #kp-plano .title{margin:0 0 10px;color:var(--hot);font-size:clamp(28px,4.2vw,52px);font-weight:800;letter-spacing:.08em}
    #kp-plano .desc{margin:0 0 22px;max-width:46ch;color:var(--muted);line-height:1.4;font-size:clamp(14px,1.1vw,20px)}
    #kp-plano .list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
    #kp-plano .item{display:flex;gap:12px;align-items:center;cursor:pointer;transition:.2s}
    #kp-plano .item:hover{transform:translateX(2px)}
    #kp-plano .num{width:30px;height:30px;border:2px solid #bcbcbc;border-radius:50%;display:grid;place-items:center;background:transparent;color:#7d7d7d;font-size:12px;font-weight:700;transition:.2s}
    #kp-plano .name{font-size:clamp(16px,1.45vw,31px);font-weight:700;line-height:1.08}
    #kp-plano .item:hover .num,#kp-plano .item.is-active .num{border-color:var(--hot);color:var(--hot);box-shadow:0 0 0 4px rgba(235,86,138,.16)}

    #kp-plano .map{position:relative;padding:10px;border:1px solid #ededed;border-radius:14px;background:#fbfbfb;overflow:hidden}
    #kp-plano svg{width:100%;height:auto;display:block}
    #kp-plano .outline{fill:none;stroke:var(--line);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
    #kp-plano .room-target{fill:var(--room)!important;stroke:#f2f2f2;stroke-width:1.1;cursor:pointer;transition:fill .2s ease,opacity .2s ease}
    #kp-plano svg.has-focus .room-target{opacity:.34}
    #kp-plano .room-target:hover,#kp-plano .room-target.is-active{fill:var(--hot)!important;opacity:1!important}
    #kp-plano .marker{fill:#efefef;stroke:#d8d8d8;stroke-width:1.2;transition:.2s}
    #kp-plano .marker.active{fill:var(--hot);stroke:#fff}

    #kp-plano .tag{position:absolute;display:none;min-width:230px;max-width:280px;padding:10px 12px;background:var(--card);border:1px solid #ededed;border-radius:12px;box-shadow:var(--shadow);z-index:10}
    #kp-plano .tag.open{display:block;animation:pop .2s ease}
    #kp-plano .tag::after{content:'';position:absolute;width:12px;height:12px;background:var(--card);transform:rotate(45deg);border:1px solid #ededed}
    #kp-plano .tag[data-side='right']::after{left:-7px;top:22px;border-top:0;border-right:0}
    #kp-plano .tag[data-side='left']::after{right:-7px;top:22px;border-bottom:0;border-left:0}
    #kp-plano .tag h4{margin:0 0 8px;font-size:13px}
    #kp-plano .metrics{display:flex;gap:10px}
    #kp-plano .metric{display:flex;align-items:center;gap:6px}
    #kp-plano .wheel{position:relative;width:50px;height:50px}
    #kp-plano .wheel svg{transform:rotate(-90deg)}
    #kp-plano .wheel .bg{fill:none;stroke:#ececec;stroke-width:7}
    #kp-plano .wheel .fg{fill:none;stroke:var(--hot);stroke-width:7;stroke-linecap:round;stroke-dasharray:0 999;transition:stroke-dasharray .9s ease}
    #kp-plano .wheel b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px}
    #kp-plano .meta{font-size:11px;color:#666}.meta strong{display:block;color:#333;font-size:12px}
    @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    @media (max-width:1100px){#kp-plano .grid{grid-template-columns:minmax(260px,420px) 1fr}#kp-plano .list{grid-template-columns:1fr}}
    @media (max-width:820px){#kp-plano .grid{grid-template-columns:1fr}#kp-plano .tag{min-width:210px;max-width:235px}}
  </style>

  <div class="grid">
    <section>
      <h2 class="title">PLANTA</h2>
      <p class="desc">La narrativa fluye por ocho salas, recorriendo la historia del arte sacro granadino desde el S. XVI a la actualidad.</p>
      <ol id="kp-list" class="list"></ol>
    </section>

    <section id="kp-map" class="map">
      <svg viewBox="0 0 940 600" aria-label="Planta de la catedral">
        <path class="outline" d="M10 60h90v-40h95v40h90v-40h95v40h90v-40h110M10 60v500h90v-70h95v70h90v-70h95v70h90v-70h110M520 60h100c130 0 240 110 240 240s-110 240-240 240h-100"/>
        <path class="outline" d="M110 120h400M110 250h400M110 360h400M110 500h400M610 120c95 0 170 80 170 180s-75 180-170 180"/>
        <path class="room-target" data-room="sala-1" d="M110 120h110v130H110z"/>
        <path class="room-target" data-room="sala-2" d="M220 120h135v130H220z"/>
        <path class="room-target" data-room="sala-3" d="M355 120h155v130H355z"/>
        <path class="room-target" data-room="sala-4" d="M110 360h145v140H110z"/>
        <path class="room-target" data-room="sala-5" d="M255 360h165v140H255z"/>
        <path class="room-target" data-room="sala-6" d="M420 360h90v140H420z"/>
        <path class="room-target" data-room="sala-7" d="M610 135c85 0 155 73 155 165s-70 165-155 165v-330z"/>
        <path class="room-target" data-room="sala-8" d="M610 465c95-6 170-60 210-144 10 94-24 184-97 234z"/>

        <circle class="marker" data-room="sala-1" cx="110" cy="250" r="9"/>
        <circle class="marker" data-room="sala-2" cx="355" cy="120" r="9"/>
        <circle class="marker" data-room="sala-3" cx="510" cy="185" r="9"/>
        <circle class="marker" data-room="sala-4" cx="255" cy="430" r="9"/>
        <circle class="marker" data-room="sala-5" cx="420" cy="430" r="9"/>
        <circle class="marker" data-room="sala-6" cx="510" cy="430" r="9"/>
        <circle class="marker" data-room="sala-7" cx="765" cy="300" r="9"/>
        <circle class="marker" data-room="sala-8" cx="710" cy="510" r="9"/>
      </svg>
      <aside id="kp-tag" class="tag" aria-live="polite"></aside>
    </section>
  </div>

  <script>
    (() => {
      const rooms=[
        {id:'sala-1',nombre:'Orígenes',m2:310,obras:12},
        {id:'sala-2',nombre:'Vías sacras',m2:350,obras:11},
        {id:'sala-3',nombre:'Los Mora',m2:145,obras:7},
        {id:'sala-4',nombre:'Barroco',m2:145,obras:7},
        {id:'sala-5',nombre:'Resurgir',m2:340,obras:18},
        {id:'sala-6',nombre:'Influencias',m2:120,obras:7},
        {id:'sala-7',nombre:'Miscelánea',m2:140,obras:68},
        {id:'sala-8',nombre:'Altar itinerante',m2:770,obras:13}
      ];

      const list=document.getElementById('kp-list');
      const map=document.getElementById('kp-map');
      const svg=map.querySelector('svg');
      const tag=document.getElementById('kp-tag');
      const roomEls=[...svg.querySelectorAll('.room-target')];
      const markerEls=[...svg.querySelectorAll('.marker')];
      const byId=Object.fromEntries(rooms.map(r=>[r.id,r]));
      const itemById={};

      rooms.forEach((r,i)=>{
        const li=document.createElement('li');
        li.className='item'; li.dataset.room=r.id;
        li.innerHTML=`<span class='num'>${i+1}</span><span class='name'>${r.nombre}</span>`;
        list.appendChild(li); itemById[r.id]=li;
      });

      const maxM2=Math.max(...rooms.map(r=>r.m2));
      const maxOb=Math.max(...rooms.map(r=>r.obras));

      function setActive(id){
        svg.classList.toggle('has-focus',!!id);
        Object.values(itemById).forEach(el=>el.classList.toggle('is-active',el.dataset.room===id));
        roomEls.forEach(el=>el.classList.toggle('is-active',el.dataset.room===id));
        markerEls.forEach(el=>el.classList.toggle('active',el.dataset.room===id));
      }

      function wheel(v,max,label){
        const c=Math.PI*2*18,p=Math.max(0,Math.min(1,v/max));
        return `<div class='metric'><div class='wheel' data-p='${p}' data-c='${c}'><svg viewBox='0 0 46 46'><circle class='bg' cx='23' cy='23' r='18'/><circle class='fg' cx='23' cy='23' r='18'/></svg><b>${v}</b></div><div class='meta'><strong>${label}</strong></div></div>`;
      }

      function placeTag(x,y){
        const b=map.getBoundingClientRect();
        let left=x+14, top=y-12, side='right';
        if(x>b.width*.56){left=x-258;side='left';}
        left=Math.max(8,Math.min(left,b.width-280));
        top=Math.max(8,Math.min(top,b.height-120));
        tag.dataset.side=side; tag.style.left=`${left}px`; tag.style.top=`${top}px`;
      }

      function showTag(id,ev){
        const d=byId[id]; if(!d) return;
        tag.innerHTML=`<h4>${d.nombre}</h4><div class='metrics'>${wheel(d.m2,maxM2,'m²')}${wheel(d.obras,maxOb,'obras')}</div>`;
        tag.classList.add('open');
        const box=map.getBoundingClientRect();
        let x=box.width*.5,y=box.height*.45;
        if(ev?.clientX){x=ev.clientX-box.left;y=ev.clientY-box.top}
        else { const el=svg.querySelector(`.room-target[data-room='${id}']`); const bb=el.getBBox(); x=(bb.x+bb.width*.5)*(box.width/svg.viewBox.baseVal.width); y=(bb.y+bb.height*.5)*(box.height/svg.viewBox.baseVal.height); }
        placeTag(x,y);
        requestAnimationFrame(()=>tag.querySelectorAll('.wheel').forEach(w=>{w.querySelector('.fg').style.strokeDasharray=`${(+w.dataset.p*+w.dataset.c).toFixed(1)} ${(+w.dataset.c).toFixed(1)}`;}));
      }

      [...Object.values(itemById),...roomEls,...markerEls].forEach(el=>{
        const id=el.dataset.room;
        el.addEventListener('mouseenter',()=>setActive(id));
        el.addEventListener('mouseleave',()=>setActive(null));
        el.addEventListener('click',e=>{setActive(id);showTag(id,e);});
      });

      document.addEventListener('click',e=>{ if(!map.contains(e.target)&&!list.contains(e.target)){tag.classList.remove('open');setActive(null);} });
    })();
  </script>
</div>
