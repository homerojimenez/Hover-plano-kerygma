<div id="kp-plano" class="kp-wrap" aria-label="Plano interactivo de salas">
  <style>
    #kp-plano {
      --txt: #3b3b3b;
      --txt-soft: #686868;
      --line: #d9d9d9;
      --room: #d8d8da;
      --hot: #eb568a;
      --hot-soft: #f7d7e4;
      --panel: #ffffff;
      --tag-border: #ececec;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.10);
      font-family: Inter, Montserrat, Arial, sans-serif;
      color: var(--txt);
      padding: clamp(8px, 1.8vw, 22px);
      background: transparent;
    }

    #kp-plano * { box-sizing: border-box; }

    #kp-plano .kp-grid {
      display: grid;
      grid-template-columns: minmax(320px, 500px) minmax(340px, 1fr);
      gap: clamp(18px, 2.6vw, 40px);
      align-items: start;
    }

    #kp-plano .kp-title {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 50px);
      text-transform: uppercase;
      letter-spacing: .08em;
      line-height: .95;
      color: var(--hot);
      font-weight: 800;
    }

    #kp-plano .kp-desc {
      margin: 0 0 24px;
      color: var(--txt-soft);
      font-size: clamp(14px, 1.15vw, 20px);
      line-height: 1.4;
      max-width: 42ch;
    }

    #kp-plano .kp-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 22px;
    }

    #kp-plano .kp-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      color: var(--txt);
      transition: transform .2s ease, color .2s ease;
    }

    #kp-plano .kp-item:hover { transform: translateX(2px); }

    #kp-plano .kp-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #bdbdbd;
      color: #8a8a8a;
      background: transparent;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      flex: 0 0 30px;
      transition: .2s ease;
    }

    #kp-plano .kp-name {
      font-size: clamp(16px, 1.5vw, 33px);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: .01em;
      transition: .2s ease;
    }

    #kp-plano .kp-item:hover .kp-num,
    #kp-plano .kp-item.is-active .kp-num {
      border-color: var(--hot);
      color: var(--hot);
      background: transparent;
      box-shadow: 0 0 0 4px var(--hot-soft);
    }

    #kp-plano .kp-item:hover .kp-name,
    #kp-plano .kp-item.is-active .kp-name {
      color: #252525;
    }

    #kp-plano .kp-map {
      position: relative;
      border: 1px solid #efefef;
      border-radius: 14px;
      padding: clamp(8px, 1.2vw, 14px);
      background: #fcfcfc;
      overflow: hidden;
    }

    #kp-plano svg { width: 100%; height: auto; display: block; }

    #kp-plano .room-target {
      fill: var(--room) !important;
      stroke: #f3f3f3;
      stroke-width: 1.1;
      cursor: pointer;
      transition: fill .22s ease, opacity .22s ease, filter .22s ease;
    }

    #kp-plano svg.has-focus .room-target { opacity: .34; filter: grayscale(.32); }

    #kp-plano .room-target:hover,
    #kp-plano .room-target.is-active {
      fill: var(--hot) !important;
      opacity: 1 !important;
      filter: none !important;
    }

    #kp-plano .kp-tag {
      position: absolute;
      min-width: 228px;
      max-width: 270px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--tag-border);
      background: var(--panel);
      box-shadow: var(--shadow);
      display: none;
      z-index: 20;
      transform-origin: 20% 50%;
    }

    #kp-plano .kp-tag.is-open { display: block; animation: kpPop .2s ease-out; }

    #kp-plano .kp-tag::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--panel);
      border: 1px solid var(--tag-border);
      transform: rotate(45deg);
    }

    #kp-plano .kp-tag[data-side="right"]::after { left: -7px; top: 20px; border-top: 0; border-right: 0; }
    #kp-plano .kp-tag[data-side="left"]::after { right: -7px; top: 20px; border-bottom: 0; border-left: 0; }
    #kp-plano .kp-tag[data-side="bottom"]::after { top: -7px; left: 22px; border-right: 0; border-bottom: 0; }
    #kp-plano .kp-tag[data-side="top"]::after { bottom: -7px; left: 22px; border-left: 0; border-top: 0; }

    #kp-plano .kp-tag h4 {
      margin: 0 0 8px;
      color: #252525;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 700;
    }

    #kp-plano .kp-metrics { display: flex; gap: 10px; align-items: center; }

    #kp-plano .kp-metric { display: flex; align-items: center; gap: 6px; }

    #kp-plano .kp-wheel { --size: 52px; position: relative; width: var(--size); height: var(--size); }
    #kp-plano .kp-wheel svg { transform: rotate(-90deg); }
    #kp-plano .kp-wheel .bg { fill: none; stroke: #ededed; stroke-width: 7; }
    #kp-plano .kp-wheel .fg {
      fill: none;
      stroke: var(--hot);
      stroke-linecap: round;
      stroke-width: 7;
      stroke-dasharray: 0 999;
      transition: stroke-dasharray .95s cubic-bezier(.2,.7,0,1);
    }
    #kp-plano .kp-wheel b {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #333;
      font-size: 11px;
      font-weight: 700;
    }

    #kp-plano .kp-meta { color: #6b6b6b; font-size: 11px; line-height: 1.1; }
    #kp-plano .kp-meta strong { display: block; color: #262626; font-size: 12px; margin-bottom: 2px; }

    @keyframes kpPop {
      from { opacity: 0; transform: translateY(4px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 1100px) {
      #kp-plano .kp-grid { grid-template-columns: minmax(280px, 430px) 1fr; }
      #kp-plano .kp-list { grid-template-columns: 1fr; }
      #kp-plano .kp-map { padding: 10px; }
    }

    @media (max-width: 820px) {
      #kp-plano .kp-grid { grid-template-columns: 1fr; gap: 18px; }
      #kp-plano .kp-title { margin-bottom: 8px; }
      #kp-plano .kp-list { grid-template-columns: 1fr; gap: 10px; }
      #kp-plano .kp-tag { min-width: 208px; max-width: 240px; }
    }
  </style>

  <div class="kp-grid">
    <section>
      <h2 class="kp-title">PLANTA</h2>
      <p class="kp-desc">La narrativa fluye por ocho salas, recorriendo la historia del arte sacro granadino desde el S. XVI a la actualidad.</p>
      <ol class="kp-list" id="kp-list"></ol>
    </section>

      <aside class="kp-tag" id="kp-tag" aria-live="polite"></aside>

  <script>
    (() => {
      const rooms = [
        {id:'sala-1',nombre:'Orígenes',m2:310,obras:12,selector:'#Capa_1-2 > g:nth-child(5) path:nth-child(2)'},
        {id:'sala-2',nombre:'Vías sacras',m2:350,obras:11,selector:'#Capa_1-2 > g:nth-child(4) path:nth-child(2)'},
        {id:'sala-3',nombre:'Los Mora',m2:145,obras:7,selector:'#Capa_1-2 > g:nth-child(7) path:nth-child(2)'},
        {id:'sala-4',nombre:'Barroco',m2:145,obras:7,selector:'#Capa_1-2 > g:nth-child(2) path:nth-child(1)'},
        {id:'sala-5',nombre:'Resurgir',m2:340,obras:18,selector:'#Capa_1-2 > g:nth-child(1) path:nth-child(2)'},
        {id:'sala-6',nombre:'Influencias',m2:120,obras:7,selector:'#Capa_1-2 > g:nth-child(3) path:nth-child(1)'},
        {id:'sala-7',nombre:'Miscelánea',m2:140,obras:68,selector:'#Capa_1-2 > path:nth-child(6)'},
        {id:'sala-8',nombre:'Altar itinerante',m2:770,obras:13,selector:'#Capa_1-2 > g:nth-child(8) path:nth-child(1)'}
      ];

      const list = document.getElementById('kp-list');
      const map = document.getElementById('kp-map');
      const svg = map.querySelector('svg');
      const tag = document.getElementById('kp-tag');
      const listById = {};
      const roomPathById = {};

      rooms.forEach((r, i) => {
        const li = document.createElement('li');
        li.className = 'kp-item';
        li.dataset.room = r.id;
        li.innerHTML = `<span class="kp-num">${i+1}</span><span class="kp-name">${r.nombre}</span>`;
        list.appendChild(li);
        listById[r.id] = li;

        const p = svg.querySelector(r.selector);
        if (p) {
          p.dataset.room = r.id;
          p.classList.add('room-target');
          roomPathById[r.id] = p;
        }
      });

      const maxM2 = Math.max(...rooms.map(r => r.m2), 1);
      const maxOb = Math.max(...rooms.map(r => r.obras), 1);

      const setActive = (id) => {
        svg.classList.toggle('has-focus', !!id);
        Object.values(listById).forEach(el => el.classList.toggle('is-active', el.dataset.room === id));
        Object.values(roomPathById).forEach(el => el.classList.toggle('is-active', el.dataset.room === id));
      };

      function wheel(value, max, label) {
        const c = Math.PI * 2 * 18;
        const p = Math.max(0, Math.min(1, value / max));
        return `<div class="kp-metric"><div class="kp-wheel" data-pct="${p}" data-c="${c}"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="18"></circle><circle class="fg" cx="23" cy="23" r="18"></circle></svg><b>${value}</b></div><div class="kp-meta"><strong>${label}</strong></div></div>`;
      }

      function placeTagNear(x, y) {
        const box = map.getBoundingClientRect();
        const centerX = box.width * 0.5;
        const centerY = box.height * 0.5;

        let left = x + 14;
        let top = y - 10;
        let side = 'right';

        if (x > centerX && x > 180) { left = x - 250; side = 'left'; }
        if (y < 72) { top = y + 18; side = 'bottom'; }
        if (y > box.height - 90) { top = y - 118; side = 'top'; }

        left = Math.min(Math.max(8, left), box.width - 260);
        top = Math.min(Math.max(8, top), box.height - 128);

        tag.dataset.side = side;
        tag.style.left = `${left}px`;
        tag.style.top = `${top}px`;
      }

      function showTag(id, ev) {
        const d = rooms.find(r => r.id === id);
        if (!d) return;

        tag.innerHTML = `<h4>${d.nombre}</h4><div class="kp-metrics">${wheel(d.m2, maxM2, 'm²')}${wheel(d.obras, maxOb, 'obras')}</div>`;
        tag.classList.add('is-open');

        const mapBox = map.getBoundingClientRect();
        let x = mapBox.width * .48;
        let y = mapBox.height * .42;

        if (ev && typeof ev.clientX === 'number') {
          x = ev.clientX - mapBox.left;
          y = ev.clientY - mapBox.top;
        } else if (roomPathById[id]) {
          const b = roomPathById[id].getBBox();
          x = (b.x + b.width * .52) * (mapBox.width / svg.viewBox.baseVal.width);
          y = (b.y + b.height * .5) * (mapBox.height / svg.viewBox.baseVal.height);
        }

        placeTagNear(x, y);

        requestAnimationFrame(() => {
          tag.querySelectorAll('.kp-wheel').forEach(w => {
            const fg = w.querySelector('.fg');
            fg.style.strokeDasharray = `${(+w.dataset.pct * +w.dataset.c).toFixed(1)} ${(+w.dataset.c).toFixed(1)}`;
          });
        });
      }

      Object.values(listById).forEach(el => {
        const id = el.dataset.room;
        el.addEventListener('mouseenter', () => setActive(id));
        el.addEventListener('mouseleave', () => setActive(null));
        el.addEventListener('click', () => { setActive(id); showTag(id); });
      });

      Object.values(roomPathById).forEach(el => {
        const id = el.dataset.room;
        el.addEventListener('mouseenter', () => setActive(id));
        el.addEventListener('mouseleave', () => setActive(null));
        el.addEventListener('click', (e) => { setActive(id); showTag(id, e); });
      });

      document.addEventListener('click', (e) => {
        if (!map.contains(e.target) && !list.contains(e.target)) {
          tag.classList.remove('is-open');
          setActive(null);
        }
      });

      window.addEventListener('resize', () => {
        if (tag.classList.contains('is-open')) {
          const active = svg.querySelector('.room-target.is-active');
          if (active) {
            const mapBox = map.getBoundingClientRect();
            const b = active.getBBox();
            const x = (b.x + b.width * .52) * (mapBox.width / svg.viewBox.baseVal.width);
            const y = (b.y + b.height * .5) * (mapBox.height / svg.viewBox.baseVal.height);
            placeTagNear(x, y);
          }
        }
      });
    })();
  </script>
</div>
