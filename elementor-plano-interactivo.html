<div id="kp-plano" class="kp-wrap" aria-label="Plano interactivo de salas">
  <style>
    #kp-plano{--bg:#000;--txt:#d7d7d7;--line:#f2f2f2;--room:#cfcfd1;--hot:#eb568a;--tag:#111;--tag-border:#2a2a2a;font-family:Inter,Montserrat,Arial,sans-serif;background:var(--bg);color:var(--txt);padding:clamp(12px,2vw,24px)}
    #kp-plano *{box-sizing:border-box} #kp-plano .kp-grid{display:grid;grid-template-columns:minmax(280px,520px) 1fr;gap:clamp(20px,3vw,40px)}
    #kp-plano .kp-title{font-size:clamp(28px,4vw,52px);letter-spacing:.08em;text-transform:uppercase;color:var(--hot);margin:0 0 16px;font-weight:800}
    #kp-plano .kp-desc{font-size:clamp(15px,1.2vw,21px);line-height:1.35;color:#b7b7b7;max-width:50ch;margin:0 0 28px}
    #kp-plano .kp-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
    #kp-plano .kp-item{display:flex;align-items:center;gap:12px;cursor:pointer}.kp-num{display:grid;place-items:center;width:28px;height:28px;border:2px solid #dfdfdf;border-radius:50%;font-size:12px;font-weight:700;color:#efefef;flex:0 0 28px}
    #kp-plano .kp-name{font-size:clamp(16px,1.5vw,38px);font-weight:700;line-height:1.1}
    #kp-plano .kp-item.is-active .kp-num,#kp-plano .kp-item:hover .kp-num{border-color:var(--hot);color:var(--hot)}
    #kp-plano .kp-item.is-active .kp-name,#kp-plano .kp-item:hover .kp-name{color:#fff;text-shadow:0 0 9px rgba(235,86,138,.35)}
    #kp-plano .kp-item.is-active .kp-name::after{content:'  👁';font-size:.75em;color:var(--hot)}
    #kp-plano .kp-map{position:relative} #kp-plano svg{width:100%;height:auto;display:block}
    #kp-plano .room-target{fill:var(--room)!important;stroke:#ececec;stroke-width:1.2;cursor:pointer;transition:.2s}
    #kp-plano svg.has-focus .room-target{opacity:.35;filter:grayscale(.3)}
    #kp-plano .room-target.is-active,#kp-plano .room-target:hover{fill:var(--hot)!important;opacity:1!important;filter:none!important}
    #kp-plano .kp-tag{position:absolute;min-width:220px;padding:10px 12px;background:rgba(17,17,17,.95);border:1px solid var(--tag-border);border-radius:10px;display:none;z-index:5}
    #kp-plano .kp-tag.is-open{display:block}.kp-tag:after{content:'';position:absolute;left:16px;bottom:-8px;width:14px;height:14px;background:inherit;border-left:1px solid var(--tag-border);border-bottom:1px solid var(--tag-border);transform:rotate(-45deg)}
    #kp-plano .kp-tag h4{margin:0 0 8px;font-size:13px;color:#fff}.kp-metrics{display:flex;gap:10px}.kp-wheel{--size:54px;position:relative;width:var(--size);height:var(--size)}
    .kp-wheel svg{transform:rotate(-90deg)}.kp-wheel .bg{fill:none;stroke:#2f2f2f;stroke-width:7}.kp-wheel .fg{fill:none;stroke:var(--hot);stroke-linecap:round;stroke-width:7;stroke-dasharray:0 999;transition:stroke-dasharray 1s cubic-bezier(.2,.7,0,1)}
    .kp-wheel b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#fff}.kp-meta{font-size:12px;color:#d8d8d8}
    @media (max-width:980px){#kp-plano .kp-grid{grid-template-columns:1fr}#kp-plano .kp-list{grid-template-columns:1fr}}
  </style>
  <div class="kp-grid">
    <section>
      <h2 class="kp-title">PLANTA</h2>
      <p class="kp-desc">Hover cruzado entre lista y plano, click para abrir bocadillo con métricas.</p>
      <ol class="kp-list" id="kp-list"></ol>
    </section>
    <section class="kp-map" id="kp-map">
      <!-- SVG real recibido. Mantén este bloque tal cual. -->

          <g><path class="cls-1" d="M425.2,154.15c0-3.87,2.34-7.2,5.68-8.65-5.08-18.06-14.63-34.28-27.39-47.38-3.07-3.15-6.32-6.12-9.74-8.89h0c-3.79-3.09-7.79-5.92-11.97-8.49-1.36-.83-2.73-1.63-4.12-2.41l-1.92,3.79-17.03,33.68,9.56,8.24.32.27-.27.33c-3.46,4.13-6.92,8.29-10.35,12.44,10.58,9.51,17.24,23.25,17.24,38.54,0,7.26-1.51,14.16-4.21,20.44l53.79,21.87,1.6.65c.22-.53.44-1.06.64-1.59,1.67-4.12,3.09-8.37,4.25-12.72,1.11-4.14,1.98-8.36,2.59-12.67.76-5.22,1.15-10.55,1.15-15.97,0-4.08-.22-8.1-.65-12.06-5.09-.15-9.17-4.32-9.17-9.42Z"/></g>

          <path class="cls-1" d="M358.19,115.91l9.81,8.45c-3.54,4.25-7.09,8.5-10.61,12.76-8.83-7.8-20.38-12.65-33.04-12.93v-9.82c4.55-.68,8.06-4.61,8.06-9.34s-3.51-8.65-8.06-9.32v-31.93c19.27.22,37.38,5.25,53.15,13.95l-19.31,38.18Z"/>
          <g><path class="cls-1" d="M227.02,98.36c-.12,0-.24,0-.36.02-3.16.18-5.68,2.8-5.68,5.99,0,1.68.69,3.2,1.81,4.28,1.09,1.09,2.58,1.74,4.23,1.74,3.33,0,6.04-2.7,6.04-6.02s-2.71-6.01-6.04-6.01Z"/><path class="cls-1" d="M226.66,94.95v-32.63l-42.04.2v83.64l35.73-35.11c-1.72-1.71-2.79-4.07-2.79-6.68,0-5.08,4.06-9.24,9.1-9.42Z"/></g>

      </svg>
      <aside class="kp-tag" id="kp-tag" aria-live="polite"></aside>

  </div>
  <script>
  (()=>{
    const rooms=[
      {id:'sala-1',nombre:'Orígenes',m2:310,obras:12,selector:'#Capa_1-2 > g:nth-child(5) path:nth-child(2)'},
      {id:'sala-2',nombre:'Vías sacras',m2:350,obras:11,selector:'#Capa_1-2 > g:nth-child(4) path:nth-child(2)'},
      {id:'sala-3',nombre:'Los Mora',m2:145,obras:7,selector:'#Capa_1-2 > g:nth-child(7) path:nth-child(2)'},
      {id:'sala-4',nombre:'Barroco',m2:145,obras:7,selector:'#Capa_1-2 > g:nth-child(2) path:nth-child(1)'},
      {id:'sala-5',nombre:'Resurgir',m2:340,obras:18,selector:'#Capa_1-2 > g:nth-child(1) path:nth-child(2)'},
      {id:'sala-6',nombre:'Influencias',m2:120,obras:7,selector:'#Capa_1-2 > g:nth-child(3) path:nth-child(1)'},
      {id:'sala-7',nombre:'Miscelánea',m2:140,obras:68,selector:'#Capa_1-2 > path:nth-child(6)'},
      {id:'sala-8',nombre:'Altar itinerante',m2:770,obras:13,selector:'#Capa_1-2 > g:nth-child(8) path:nth-child(1)'}
    ];
    const list=document.getElementById('kp-list'); const map=document.getElementById('kp-map'); const svg=map.querySelector('svg'); const tag=document.getElementById('kp-tag');
    const listById={}; const roomPathById={};
    rooms.forEach((r,i)=>{const li=document.createElement('li');li.className='kp-item';li.dataset.room=r.id;li.innerHTML=`<span class="kp-num">${i+1}</span><span class="kp-name">${r.nombre}</span>`;list.appendChild(li);listById[r.id]=li; const p=svg.querySelector(r.selector); if(p){p.dataset.room=r.id;p.classList.add('room-target');roomPathById[r.id]=p;}});
    const maxM2=Math.max(...rooms.map(r=>r.m2),1),maxOb=Math.max(...rooms.map(r=>r.obras),1);
    const setActive=id=>{svg.classList.toggle('has-focus',!!id);Object.values(listById).forEach(e=>e.classList.toggle('is-active',e.dataset.room===id));Object.values(roomPathById).forEach(e=>e.classList.toggle('is-active',e.dataset.room===id));};
    const wheel=(v,max,l)=>{const c=Math.PI*2*18,p=Math.max(0,Math.min(1,v/max));return `<div class="kp-wheel" data-pct="${p}" data-c="${c}"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="18"></circle><circle class="fg" cx="23" cy="23" r="18"></circle></svg><b>${v}</b></div><div class="kp-meta"><strong>${l}</strong></div>`};
    function showTag(id,ev){const d=rooms.find(r=>r.id===id); if(!d) return; tag.innerHTML=`<h4>${d.nombre}</h4><div class='kp-metrics'>${wheel(d.m2,maxM2,'m²')}${wheel(d.obras,maxOb,'obras')}</div>`; tag.classList.add('is-open');
      const b=map.getBoundingClientRect(); const r=(roomPathById[id]&&roomPathById[id].getBBox)?roomPathById[id].getBBox():{x:120,y:80,width:60,height:60};
      const x=ev?.clientX?ev.clientX-b.left:(r.x+r.width*.55)*(b.width/svg.viewBox.baseVal.width), y=ev?.clientY?ev.clientY-b.top:(r.y+r.height*.5)*(b.height/svg.viewBox.baseVal.height);
      tag.style.left=`${Math.min(Math.max(8,x+12),b.width-232)}px`; tag.style.top=`${Math.min(Math.max(8,y-10),b.height-120)}px`;
      requestAnimationFrame(()=>tag.querySelectorAll('.kp-wheel').forEach(w=>{const fg=w.querySelector('.fg');fg.style.strokeDasharray=`${(+w.dataset.pct*+w.dataset.c).toFixed(1)} ${(+w.dataset.c).toFixed(1)}`;})); }
    Object.values(listById).forEach(el=>{const id=el.dataset.room;el.onmouseenter=()=>setActive(id);el.onmouseleave=()=>setActive(null);el.onclick=()=>{setActive(id);showTag(id);};});
    Object.values(roomPathById).forEach(el=>{const id=el.dataset.room;el.onmouseenter=()=>setActive(id);el.onmouseleave=()=>setActive(null);el.onclick=e=>{setActive(id);showTag(id,e);};});
    document.addEventListener('click',e=>{if(!map.contains(e.target)&&!list.contains(e.target)){tag.classList.remove('is-open');setActive(null);}});
  })();
  </script>
</div>
